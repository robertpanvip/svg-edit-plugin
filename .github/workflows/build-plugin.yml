name: Build Plugin

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v1.0.0"
        type: string
permissions:
  contents: write

jobs:
  build-native:
    name: Build Native Library
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build resvg_bridge
        working-directory: native/resvg_bridge
        run: cargo build --release

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.os }}
          path: native/resvg_bridge/target/release/


  build-plugin:
    name: Build IntelliJ Plugin
    runs-on: ubuntu-latest
    needs: build-native

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle


      # 下载 Linux native
      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-lib-ubuntu-latest
          path: native/resvg_bridge/target/release/
          
      - name: Create Gradle wrapper
        run: gradle wrapper

      - name: Build plugin
        run: ./gradlew :plugin:buildPlugin


      - name: Run tests
        run: ./gradlew test


      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifacts
          path: plugin/build/distributions/


  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-plugin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: plugin-artifacts
          path: artifacts

      # 获取 tag
      - name: Get tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
