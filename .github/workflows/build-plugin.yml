name: Build Plugin

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-native:
    name: Build Native Library
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build resvg_bridge
        working-directory: native/resvg_bridge
        run: cargo build --release

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.os }}
          path: native/resvg_bridge/target/release/

  build-plugin:
    name: Build IntelliJ Plugin
    runs-on: ubuntu-latest
    needs: build-native
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-lib-ubuntu-latest
          path: native/resvg_bridge/target/release/

      - name: Create Gradle wrapper
        run: gradle wrapper

      - name: Build plugin
        run: ./gradlew :plugin:buildPlugin
        
      - name: Run tests
        run: ./gradlew test

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifacts
          path: plugin/build/distributions/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-plugin
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: plugin-artifacts
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
