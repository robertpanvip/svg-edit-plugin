name: Build Plugin

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v1.0.0"
        type: string
permissions:
  contents: write

jobs:
  build-native:
    name: Build Native Library
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build resvg_bridge
        working-directory: native/resvg_bridge
        run: cargo build --release

      # Upload ONLY the platform's cdylib so the plugin job can bundle all three
      # platform libs into one cross-platform plugin zip (uploading the whole
      # target/release/ dir would drag in multi-GB build intermediates).
      - name: Upload native artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.os }}
          path: native/resvg_bridge/target/release/libresvg_bridge.so

      - name: Upload native artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.os }}
          path: native/resvg_bridge/target/release/resvg_bridge.dll

      - name: Upload native artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.os }}
          path: native/resvg_bridge/target/release/libresvg_bridge.dylib


  build-plugin:
    name: Build IntelliJ Plugin
    runs-on: ubuntu-latest
    needs: build-native

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle


      # Download ALL platform native libs produced by the build-native job so the
      # bundled plugin zip works on Windows/macOS/Linux (SvgBridgeLoader picks the
      # right file name for the runtime OS). Shipping only the Linux .so made the
      # plugin show a blank/“native library missing” panel on Windows.
      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-lib-ubuntu-latest
          path: native/resvg_bridge/target/release/

      - name: Download native artifacts (Windows)
        uses: actions/download-artifact@v4
        with:
          name: native-lib-windows-latest
          path: native/resvg_bridge/target/release/

      - name: Download native artifacts (macOS)
        uses: actions/download-artifact@v4
        with:
          name: native-lib-macos-latest
          path: native/resvg_bridge/target/release/

      # The committed gradlew has no executable bit (the GitHub contents API cannot set one),
      # so restore it here. Also guards against a truncated wrapper script.
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      # NOTE: The Gradle wrapper is committed and pinned to 8.10
      # (see gradle/wrapper/gradle-wrapper.properties). IntelliJ Platform
      # Gradle Plugin 2.1.0 requires Gradle 8.x. Do NOT regenerate the wrapper
      # with the runner's system Gradle (9.x) here: configuring the project
      # under Gradle 9 fails with "Method call not allowed" in plugin/build.gradle.kts,
      # so the wrapper task never runs and ./gradlew falls back to a 9.x distribution.
      - name: Build plugin
        run: ./gradlew :plugin:buildPlugin

      - name: Run tests
        run: ./gradlew test

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifacts
          path: plugin/build/distributions/


  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-plugin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: plugin-artifacts
          path: artifacts

      # Resolve the release tag.
      - name: Get tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
