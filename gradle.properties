# The IntelliJ Platform bundles the Kotlin standard library (IDEA 2023.2 ships kotlin-stdlib
# 1.9.0) and org.jetbrains:annotations, so the plugin must not ship its own copies — doing so
# added 1.6 MB to every release zip. Disabling KGP's automatic stdlib dependency lets each module
# declare it exactly where it belongs:
#   - core / plugin : compileOnly (the platform provides it at runtime)
#   - app           : implementation (the standalone runtime has no platform)
kotlin.stdlib.default.dependency=false
