[package]
name = "oxvg_measure"
version = "0.0.0"
edition = "2021"

# Minimal crate that links ONLY the SVGO engine (oxvg), with the same release profile that the
# shipped sidecar uses. Building this tells us how much of the real binary is the optimiser.
[dependencies]
oxvg_ast = { version = "=0.0.7", features = ["roxmltree", "selectors"] }
oxvg_optimiser = "=0.0.7"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"