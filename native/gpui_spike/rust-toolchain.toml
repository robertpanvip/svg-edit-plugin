# Pinned toolchain for the spike.
#
# GPUI (as published in the `gpui-pre` 0.3.x snapshot crates) uses standard-library features that
# are NOT yet stable on older compilers:
#   - `slice_as_array` (gpui-pre-util)  -> stabilized in 1.94
#   - `std::hint::cold_path` (gpui-pre) -> still unstable on 1.94.1
# Builds fail with `error[E0658]: use of unstable library feature` on 1.92/1.94. 1.98.1 is the
# version this crate was verified to build with.
[toolchain]
channel = "1.98.1"
