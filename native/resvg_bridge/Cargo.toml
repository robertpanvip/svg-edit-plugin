[package]
name = "resvg_bridge"
version = "0.5.0"
edition = "2021"

[profile.release]
# Size tuning. The plugin ships one copy of this crate per platform, so every byte is paid for
# three times over.
#
# opt-level is deliberately left at the default (3). Measured on a 600-shape document, building
# with opt-level="s" rendered 2.5x and opt-level="z" 4.4x SLOWER than opt-level=3 — unusable for
# an interactive editor. LTO + a single codegen unit get most of the size win *without* that
# regression (23.5ms -> 22.4ms per render here, i.e. neutral-to-faster).
lto = "fat"
codegen-units = 1
# Drop symbol tables. JNA resolves entry points through .dynsym, which `strip` preserves.
strip = "symbols"
# panic MUST stay "unwind": the sidecar's request loop wraps every handler in catch_unwind so a
# single bad request becomes an error reply instead of taking the process (and the IDE session)
# down. "abort" would compile that safety net away.
panic = "unwind"

# ---- Optimiser built for size, not speed ----------------------------------------
#
# The SVGO engine (`oxvg_*`) drags in lightningcss (a whole CSS parser/minifier, for
# minifyStyles), the geo/i_overlay/spade path-arithmetic stack (for the path jobs) and a
# regex/selector stack. Measured on the real sidecar, those crates are the difference between
# 13.3 MB and 8.7 MB uncompressed (5.0 MB vs 3.5 MB deflated) — and the plugin pays that three
# times over, once per OS sidecar. This is the single largest lever on the shipped zip.
#
# It costs only optimiser speed, never render speed: every crate below is off the render path,
# and every crate ON the render path (resvg, usvg, tiny-skia, rustybuzz, fontdb, ttf-parser,
# svgtypes, roxmltree, ...) keeps the profile default of 3. SVGO is a one-shot job behind a
# button, so a few times slower is a fair trade for ~4.6 MB off the download.
#
# If the SVGO button ever feels slow on large documents, raise these to "s" — that lands
# between the two, still well under opt-level 3.
[profile.release.package.lightningcss]
opt-level = "z"
[profile.release.package.lightningcss-derive]
opt-level = "z"
[profile.release.package.oxvg_ast]
opt-level = "z"
[profile.release.package.oxvg_collections]
opt-level = "z"
[profile.release.package.oxvg_optimiser]
opt-level = "z"
[profile.release.package.oxvg_parse]
opt-level = "z"
[profile.release.package.oxvg_path]
opt-level = "z"
[profile.release.package.oxvg_serialize]
