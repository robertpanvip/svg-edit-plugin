<!-- Drawn for SVG Easy in the IntelliJ expui style (16x16, currentColor): text lines of uneven
     length, the usual "reformat / re-indent" mark. Deliberately unlike the SVGO-settings glyph
     (three sliders with knobs on them) — this one has no knobs, it is just paragraphs. -->
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect x="1.5" y="2.5" width="13" height="1" rx="0.5" fill="currentColor"/>
<rect x="1.5" y="6" width="8" height="1" rx="0.5" fill="currentColor"/>
<rect x="1.5" y="9.5" width="11" height="1" rx="0.5" fill="currentColor"/>
<rect x="1.5" y="13" width="6" height="1" rx="0.5" fill="currentColor"/>
</svg>
