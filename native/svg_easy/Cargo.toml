[package]
name = "svg_easy"
version = "0.1.0"
edition = "2021"
publish = false

# The standalone SVG Easy editor: one native binary, no JVM, no IntelliJ plugin host.
#
# Version pairing is deliberate and pinned. GPUI is published as a set of snapshot crates and they
# must move together:
#   gpui-pre          -> lib `gpui`              (framework)
#   gpui-pre-platform -> lib `gpui_platform`     (windowing/text backends + `application()`)
#   gpui-component    -> widgets + code editor, built against `gpui-pre` ^0.3.1
# All are pre-1.0 and drift between releases, so bump them as a set.
#
# The toolchain is pinned in `rust-toolchain.toml`: `gpui-pre` 0.3.x uses std features that are
# not stable on older compilers and fails to build below 1.98.
[dependencies]
gpui-pre = "0.3.4"
gpui-pre-platform = { version = "0.3.4", features = ["font-kit", "wayland", "x11"] }
# `tree-sitter` turns on the editor's highlighting machinery. The XML grammar itself is registered
# by hand at startup, because gpui-component bundles no XML grammar — see `main.rs`.
gpui-component = { version = "0.6.1", features = ["tree-sitter"] }
tree-sitter-xml = "0.7"
# The rendering engine, shared with the IntelliJ plugin. Here it is linked in-process: no sidecar,
# no JSON-RPC, no JNA — the app calls `Session` directly.
resvg_bridge = { path = "../resvg_bridge" }
# Must match the `image` version gpui-pre uses: `RenderImage` is built from `image::Frame` values.
image = "0.25"
serde_json = "1"

# Windows takes the `.exe`'s icon from a linked-in resource, so `build.rs` needs a resource
# compiler. Target-gated: on Linux and macOS the build script compiles to nothing.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Size tuning for the shipped archive.
#
# This block is a deliberate duplicate of `resvg_bridge`'s: Cargo reads `[profile.*]` only from the
# root manifest of a build, and the two crates are separate packages rather than one workspace, so
# whichever is the root ignores the other's block. Building `svg_easy` with no block of its own is
# what put the archive on the default profile — no LTO, 16 codegen units, and a full symbol table.
#
# `thin`, not `fat`: the app links gpui and its whole widget tree, and whole-program LTO over that
# peaks well past what a modest build machine has (it was OOM-killed at ~5 GB here). Thin LTO gets
# the cross-crate inlining and dead-code removal — which is where the size win is — while keeping
# the peak far lower. `resvg_bridge` still uses `fat`, which its much smaller tree can afford.
#
# opt-level stays at the default (3). The render path runs in *this* process, and `resvg_bridge`
# measured "s" and "z" to be 2.5x / 4.4x slower at drawing a 600-shape document, which an
# interactive editor cannot pay.
[profile.release]
lto = "thin"
codegen-units = 1
# Unlike the sidecar, nothing loads this binary dynamically — there is no JNA on the other end —
# so the symbols serve no purpose at runtime.
strip = "symbols"
