<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4D8DFF"/>
            <stop offset="1" stop-color="#1FA8E8"/>
        </linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
    </defs>

    <!-- Rounded tile -->
    <rect x="1" y="1" width="38" height="38" rx="9" fill="url(#bg)"/>
    <rect x="1" y="1" width="38" height="19" rx="9" fill="url(#glass)"/>

    <!-- Bezier path being edited (topmost visual layer) -->
    <path d="M8.5 27.5 C 11 18.5, 16 13.5, 20.5 18.5 C 24.5 23, 27.5 20, 31.5 12"
          fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity="0.95"/>

    <!-- Anchor nodes: square markers, the middle one is the "selected" filled node -->
    <rect x="5.5" y="24.5" width="6" height="6" rx="1.4"
          fill="#FFFFFF" stroke="#2E6FD8" stroke-width="1.2"/>
    <rect x="17.5" y="15.5" width="6" height="6" rx="1.4"
          fill="#2E6FD8" stroke="#FFFFFF" stroke-width="1.4"/>
    <rect x="28.5" y="9" width="6" height="6" rx="1.4"
          fill="#FFFFFF" stroke="#2E6FD8" stroke-width="1.2"/>
</svg>
